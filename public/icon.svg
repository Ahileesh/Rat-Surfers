<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.4" />

  <!-- Neon Tunnel Ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.3" />
  <circle cx="256" cy="240" r="140" fill="none" stroke="#ec4899" stroke-width="6" stroke-opacity="0.35" />

  <!-- Cheese Wedge in Background -->
  <polygon points="256,120 380,260 160,280" fill="url(#cheese)" opacity="0.9" />
  <circle cx="240" cy="210" r="16" fill="#ca8a04" opacity="0.4" />
  <circle cx="310" cy="235" r="12" fill="#ca8a04" opacity="0.4" />
  <circle cx="210" cy="250" r="10" fill="#ca8a04" opacity="0.4" />

  <!-- Pip Rat Face -->
  <!-- Ears -->
  <circle cx="170" cy="180" r="54" fill="url(#gold)" />
  <circle cx="170" cy="180" r="34" fill="#f472b6" />
  <circle cx="342" cy="180" r="54" fill="url(#gold)" />
  <circle cx="342" cy="180" r="34" fill="#f472b6" />

  <!-- Head -->
  <ellipse cx="256" cy="270" rx="90" ry="85" fill="url(#gold)" filter="url(#glow)" />
  <ellipse cx="256" cy="290" rx="56" ry="50" fill="#fef9c3" />

  <!-- Big Sparkling Cute Eyes -->
  <ellipse cx="215" cy="240" rx="18" ry="24" fill="#0f172a" />
  <ellipse cx="297" cy="240" rx="18" ry="24" fill="#0f172a" />
  <circle cx="210" cy="232" r="7" fill="#ffffff" />
  <circle cx="292" cy="232" r="7" fill="#ffffff" />
  <circle cx="221" cy="248" r="3.5" fill="#38bdf8" />
  <circle cx="303" cy="248" r="3.5" fill="#38bdf8" />

  <!-- Pink Snout & Nose -->
  <ellipse cx="256" cy="285" rx="14" ry="10" fill="#f43f5e" />
  
  <!-- Whiskers -->
  <line x1="170" y1="275" x2="225" y2="282" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="165" y1="295" x2="225" y2="292" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="342" y1="275" x2="287" y2="282" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="347" y1="295" x2="287" y2="292" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Subway Cap / Headband -->
  <path d="M 180 195 Q 256 160 332 195" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" />

  <!-- Title Ribbon -->
  <rect x="76" y="380" width="360" height="66" rx="20" fill="#f59e0b" />
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">RAT SURFERS</text>
</svg>
